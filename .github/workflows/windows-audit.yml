name: Windows full audit with MCP
on:
  push:
    paths:
      - '.github/workflows/windows-audit.yml'
      - 'scripts/windows-suite-audit.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  NO_PROXY: '127.0.0.1,localhost,::1'
jobs:
  full:
    name: Windows all modules py${{ matrix.python }} part${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install protocol and signature dependencies
        run: python -m pip install '.[mcp]' pytest cryptography
      - name: Record installed versions
        run: python -m pip freeze
      - name: Execute every assigned module and retain nonzero results
        run: python scripts/windows-suite-audit.py --shard ${{ matrix.shard }} --shards 8 --output audit-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.python }}-${{ matrix.shard }}
          path: audit-results
          if-no-files-found: error
